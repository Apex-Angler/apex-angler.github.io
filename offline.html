<!DOCTYPE html>
<html lang="en">
<head>

    <title> - Education Perfect</title>
    <link rel="icon" type="image/png" href="Screenshot%202026-07-31%20080025.png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1c1e;
            color: #f0f2f5;
        }
        .top-bar {
            padding: 20px 30px;
            display: flex;
            align-items: center;
        }
        .back-btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .back-btn:hover {
            background-color: #30363d;
            color: #ffffff;
            border-color: #8b949e;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }
        .container {
            max-width: 900px;
            margin: 120px auto;
            padding: 0 20px;
        }
        .card {
            background-color: #24292e;
            padding: 50px 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #00f0ff; 
            box-shadow: 0 0 15px #00f0ff, 0 0 30px rgba(0, 240, 255, 0.2);
        }
        h1 {
            margin: 0;
            color: #ffffff;
            font-size: 36px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="games.html" class="back-btn">
            <svg xmlns="http://w3.org" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>

        </a>
    </div>

    <div class="container">
        <div class="card">
            <h1>offline Games</h1>
        </div>
    </div>

    <script>
        if (sessionStorage.getItem("loggedIn") !== "true") {
            window.location.href = "index.html";
        }
    </script>
