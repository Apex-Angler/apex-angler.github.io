<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Page</title>
    <style>
        body {
            background-color: #1a1c1e;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top header container to match your exact layout alignment */
        .top-bar {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 40px;
        }

        /* Back Button styled exactly like your image */
        .back-btn {
            background-color: #25282c;
            color: #d1d5db;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            border: 1px solid #374151;
            transition: background 0.2s;
        }
        .back-btn:hover {
            background-color: #31353b;
        }

        /* The main glowing box from your image */
        .title-box {
            width: 80%;
            max-width: 800px;
            border: 2px solid #00d2ff;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            margin-bottom: 40px;
        }

        .title-box h1 {
            margin: 0;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Your game window container sitting underneath the box */
        .game-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        iframe {
            border: 2px solid #374151;
            background-color: #000000;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- Top navigation bar -->
    <div class="top-bar">
        <a href="index.html" class="back-btn">← Back</a>
    </div>

    <!-- Your exact styled box with updated text -->
    <div class="title-box">
        <h1>Games</h1>
    </div>

    <!-- The actual game file loaded underneath the box -->
    <div class="game-container">
        <iframe src="carkingarena.html" width="800" height="600"></iframe>
    </div>

</body>
</html>
