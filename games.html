<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games - Education Perfect</title>
    <link rel="icon" type="image/png" href="Screenshot%202026-07-31%20080025.png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1c1e;
            color: #f0f2f5;
        }
        nav {
            background-color: #0d1117;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0366d6;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #0366d6;
        }
        .nav-links a {
            color: #f0f2f5;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }
        .nav-links a:hover {
            color: #0366d6;
        }
        .container {
            max-width: 900px;
            margin: 80px auto;
            padding: 0 20px;
        }
        .card {
            background-color: #24292e;
            padding: 40px 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #00f0ff; 
            box-shadow: 0 0 15px #00f0ff, 
                        0 0 30px rgba(0, 240, 255, 0.2), 
                        inset 0 0 15px rgba(0, 240, 255, 0.1);
        }
        h1 {
            margin: 0;
            color: #ffffff;
            font-size: 32px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        /* Responsive Arcade Game Window Container */
        .arcade-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            height: 480px;
            margin: 30px auto 0 auto;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #0366d6;
            box-shadow: 0 0 15px rgba(3, 102, 214, 0.5);
            background-color: #000;
        }
        
        .arcade-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Offline Link Button element styling */
        .offline-btn {
            margin-top: 30px;
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-block;
            text-decoration: none;
        }

        .offline-btn:hover {
            background-color: #30363d;
            color: #ffffff;
            border-color: #8b949e;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <nav>
        <div class="logo">Apex Files</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="#">About</a>
        </div>
    </nav>

    <!-- Page Body -->
    <div class="container">
        <div class="card">
            <h1>Arcade Station</h1>
            
            <!-- EMBEDDED RETRO ARCADE WINDOW RESTORED -->
            <div class="arcade-container">
                <iframe src="https://github.io" title="Arcade Game"></iframe>
            </div>

            <!-- OFFLINE LINK BUTTON ELEMENT -->
            <div>
                <a href="offline.html" class="offline-btn">Offline</a>
            </div>
            
        </div>
    </div>

    <script>
        if (sessionStorage.getItem("loggedIn") !== "true") {
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
