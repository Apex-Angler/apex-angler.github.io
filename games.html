<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- This sets the browser tab text to look like Education Perfect -->
    <title> - Education Perfect</title>
    
    <!-- This sets the browser tab logo to the Education Perfect icon -->
    <link rel="icon" type="image/x-icon" href="https://educationperfect.com">
    
    <style>
        body {
            background-color: #161819;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top navigation header bar */
        .navbar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            box-sizing: border-box;
            border-bottom: 2px solid #0056b3; /* Dark blue accent line */
            background-color: #161819;
        }

        .navbar-brand {
            color: #3b82f6; /* Bright blue text for Apex Files */
            font-weight: bold;
            font-size: 18px;
            text-decoration: none;
        }

        .navbar-links a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        .navbar-links a:hover {
            color: #00d2ff;
        }

        /* Main content layout */
        .content-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
            box-sizing: border-box;
        }

        /* The main glowing container box */
        .title-box {
            width: 80%;
            max-width: 800px;
            background-color: #1f2326;
            border: 2px solid #00d2ff;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            margin-bottom: 50px;
        }

        .title-box h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Hidden game container wrapper */
        .game-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        /* Clean game screen box sitting directly below the text box */
        iframe {
            border: 2px solid #374151;
            background-color: #000000;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- Top Navigation Header -->
    <div class="navbar">
        <a href="index.html" class="navbar-brand">Apex Files</a>
        <div class="navbar-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </div>
    </div>

    <!-- Main Page Body -->
    <div class="content-container">
        
        <!-- Glowing title box displaying Games -->
        <div class="title-box">
            <h1>Games</h1>
        </div>

        <!-- The actual game file loading space -->
        <div class="game-container">
            <iframe src="carkingarena.html" width="800" height="600"></iframe>
        </div>

    </div>

</body>
</html>
