<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Room - Apex Angler</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #00ffcc;
        }
        .nav-links {
            margin-bottom: 30px;
        }
        .nav-links a {
            color: #aaa;
            text-decoration: none;
            margin: 0 15px;
        }
        .nav-links a:hover {
            color: #00ffcc;
        }
        .game-container {
            margin: 20px auto;
            max-width: 820px;
            background: #2b2b2b;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        iframe {
            background-color: #000;
            border: 2px solid #333;
            border-radius: 4px;
            display: block;
            margin: 0 auto;
        }
        .btn {
            background-color: #00ffcc;
            color: #1a1a1a;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #00cca3;
        }
    </style>
</head>
<body>

    <div class="nav-links">
        <a href="index.html">← Back to Home</a>
    </div>

    <h1>The Arcade Room</h1>
    <p>Play my custom-built HTML game right inside the browser!</p>

    <!-- This is the container that embeds your game file -->
    <div class="game-container">
        <!-- Change 'my-game-file.html' to match your uploaded game's filename -->
        <iframe src="my-game-file.html" width="800" height="500">
            Your browser does not support iframes.
        </iframe>
    </div>

    <!-- Alternative option to open the game fullscreen -->
    <a href="my-game-file.html" target="_blank" class="btn">Launch Fullscreen</a>

</body>
</html>
