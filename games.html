<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    <style>
        body {
            background-color: #1a1c1e;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top navigation header matching your image */
        .navbar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            box-sizing: border-box;
            border-bottom: 2px solid #0056b3; /* Dark blue accent line */
            background-color: #1a1c1e;
        }

        .navbar-brand {
            color: #007bff; /* Bright blue brand text */
            font-weight: bold;
            font-size: 18px;
            text-decoration: none;
        }

        .navbar-links a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        .navbar-links a:hover {
            color: #00d2ff;
        }

        /* Main layout layout container */
        .content-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* The main glowing box from your image */
        .title-box {
            width: 80%;
            max-width: 800px;
            border: 2px solid #00d2ff;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            margin-bottom: 40px;
        }

        .title-box h1 {
            margin: 0;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Game window container sitting cleanly underneath the box */
        .game-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        iframe {
            border: 2px solid #374151;
            background-color: #000000;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar matching your header -->
    <div class="navbar">
        <a href="index.html" class="navbar-brand">Apex Files</a>
        <div class="navbar-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="content-container">
        
        <!-- Styled title box changing 'Sound Board' to 'Games' -->
        <div class="title-box">
            <h1>Games</h1>
        </div>

        <!-- Your game loading container underneath the box -->
        <div class="game-container">
            <iframe src="carkingarena.html" width="800" height="600"></iframe>
        </div>

    </div>

</body>
</html>
