<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education Perfect</title>
    <link rel="icon" type="image/png" href="Screenshot%202026-07-31%20080025.png">
    <style>
        /* Base Page Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1c1e; /* Dark stealth background */
            color: #f0f2f5; /* Off-white readable text */
        }

        /* Navigation Bar */
        nav {
            background-color: #0d1117;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0366d6;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #0366d6;
        }
        .nav-links a {
            color: #f0f2f5;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }
        .nav-links a:hover {
            color: #0366d6;
        }

        /* Main Content Container */
        .container {
            max-width: 900px;
            margin: 80px auto;
            padding: 0 20px;
        }

        /* Centered Content Card with Neon Blue Glow */
        .card {
            background-color: #24292e;
            padding: 40px 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #00f0ff; 
            box-shadow: 0 0 15px #00f0ff, 
                        0 0 30px rgba(0, 240, 255, 0.2), 
                        inset 0 0 15px rgba(0, 240, 255, 0.1);
        }
        
        h1 {
            margin: 0;
            color: #ffffff;
            font-size: 32px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
            margin-bottom: 30px; /* Pushes the button cleanly below the text */
        }

        /* Clickable Link Styling for Image Button */
        .image-link-btn {
            background-color: #ffffff; /* Gives the black speaker icon a clean white background container */
            border: 2px solid #0366d6;
            padding: 15px;
            border-radius: 50%; /* Makes the button perfectly circular */
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
        }

        .image-link-btn img {
            width: 80px; /* Perfect size for a dashboard sound icon */
            height: 80px;
            display: block;
        }

        .image-link-btn:hover {
            transform: scale(1.1);
            border-color: #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
        }

        /* Fullscreen Password Overlay Screen */
        #passwordOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #131416;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background-color: #24292e;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 360px;
        }

        .login-box h2 {
            margin-top: 0;
            color: #ffffff;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .password-container {
            position: relative;
            margin-bottom: 20px;
        }

        .password-container input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        .password-container input:focus {
            border-color: #0366d6;
        }

        .eye-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            color: #8b949e;
            display: flex;
            align-items: center;
        }

        .eye-toggle:hover {
            color: #ffffff;
        }

        .login-btn {
            background-color: #238636;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }

        .login-btn:hover {
            background-color: #2ea043;
        }

        .error-msg {
            color: #f85149;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Lockout Screen Layer -->
    <div id="passwordOverlay">
        <div class="login-box">
            <h2>Access Required</h2>
            <div class="password-container">
                <input type="password" id="passInput" placeholder="Enter password...">
                <button class="eye-toggle" id="toggleEye" onclick="togglePasswordVisibility()">
                    <svg id="eyeIcon" xmlns="http://w3.org" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
            <button class="login-btn" onclick="checkWebsitePassword()">Submit</button>
            <div class="error-msg" id="errorDiv">Incorrect password. Access denied.</div>
        </div>
    </div>

    <!-- Navigation Header -->
    <nav>
        <div class="logo">Apex Files</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
        </div>
    </nav>

    <!-- Page Body -->
    <div class="container">
        <div class="card">
            <h1>Welcome to the Apex Files</h1>
            
            <!-- SPEAKER BUTTON LINK POINTING TO SOUNDBOARD -->
            <a href="soundboard.html" class="image-link-btn">
                <img src="speaker.png" alt="Go to Sound Board">
            </a>
            
        </div>
    </div>

    <!-- Secure UI Script Logic -->
    <script>
        const correctPassword = "Fishing=awesome"; 

        function togglePasswordVisibility() {
            const inputField = document.getElementById("passInput");
            const eyeIcon = document.getElementById("eyeIcon");
            
            if (inputField.type === "password") {
                inputField.type = "text";
                eyeIcon.innerHTML = '<line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9a3 3 0 1 1 6 6"></path><path d="M17.06 17.06A8.5 8.5 0 0 1 12 19c-7 0-11-8-11-8a18.5 18.5 0 0 1 2.16-3.19m3.72-3.72A18.5 18.5 0 0 1 12 5c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>';
            } else {
                inputField.type = "password";
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        function checkWebsitePassword() {
            const userInput = document.getElementById("passInput").value;
            const errorDiv = document.getElementById("errorDiv");
            const overlay = document.getElementById("passwordOverlay");

            if (userInput === correctPassword) {
                overlay.style.display = "none";
            } else {
                errorDiv.style.display = "block";
                document.getElementById("passInput").value = "";
            }
        }

        document.getElementById("passInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkWebsitePassword();
            }
        });
    </script>

</body>
</html>
