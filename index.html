<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Changed the text back to Education Perfect for your browser tab -->
    <title>Education Perfect</title>
    
    <link rel="icon" type="image/png" href="Screenshot%202026-07-31%20080025.png">
    <style>
        /* Base Page Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1c1e; /* Dark stealth background */
            color: #f0f2f5; /* Off-white readable text */
        }

        /* Navigation Bar */
        nav {
            background-color: #0d1117;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0366d6;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #0366d6;
        }
        .nav-links a {
            color: #f0f2f5;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }
        .nav-links a:hover {
            color: #0366d6;
        }

        /* Main Content Container */
        .container {
            max-width: 900px;
            margin: 80px auto;
            padding: 0 20px;
        }

        /* Centered Content Card with Neon Blue Glow */
        .card {
            background-color: #24292e;
            padding: 40px 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #00f0ff; 
            box-shadow: 0 0 15px #00f0ff, 
                        0 0 30px rgba(0, 240, 255, 0.2), 
                        inset 0 0 15px rgba(0, 240, 255, 0.1);
        }
        
        h1 {
            margin: 0;
            color: #ffffff;
            font-size: 32px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <nav>
        <div class="logo">Apex Files</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Gallery</a>
        </div>
    </nav>

    <!-- Page Body -->
    <div class="container">
        <div class="card">
            <h1>Welcome to the Apex Files</h1>
        </div>
    </div>

    <!-- Password Script -->
    <script>
        const password = "Fishing=awesome"; 
        let entry = prompt("Please enter the password to access the Apex Files:");
        if (entry !== password) {
            alert("Incorrect password. Access denied.");
            document.body.innerHTML = "<h1 style='color:white; text-align:center; margin-top:50px;'>Access Denied</h1>";
        }
    </script>

</body>
</html>
